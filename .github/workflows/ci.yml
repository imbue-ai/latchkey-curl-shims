# Format, lint and test the router on every push and pull request.
# The impersonating curl is only built by release.yml: it takes minutes
# per leg and changes only when curl-impersonate/pin.env does.
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: test (${{ matrix.runs-on }})
    runs-on: ${{ matrix.runs-on }}
    strategy:
      fail-fast: false
      matrix:
        runs-on: [ubuntu-latest, macos-14]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      # rustup reads rust-toolchain.toml and installs that toolchain on
      # first use.
      - name: Install the pinned Rust toolchain
        run: |
          set -euo pipefail
          rustup show active-toolchain
          cargo --version

      - run: cargo fmt --check
      - run: cargo clippy --all-targets --locked -- -D warnings
      - run: cargo test --locked
